global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # 1) метрики, которые Коллектор "ре-экспортирует" (будущие метрики ваших сервисов)
  - job_name: "otel-collector-exporter"
    static_configs:
      - targets: ["otel-collector:9464"]

  # 2) внутренние метрики самого Коллектора (для проверки связки прямо сейчас)
  - job_name: "otel-collector-telemetry"
    static_configs:
      - targets: ["otel-collector:8888"]
